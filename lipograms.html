<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lipogram Workshop</title>
<style>
  body {
    margin: 0;
    padding: 24px 16px;
    background: #fff;
    color: #000;
    font-family: system-ui, sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; }
  label { font-size: 1rem; }
  #avoid {
    width: 10em;
    margin-left: 8px;
    padding: 4px 8px;
    font-size: 1.1rem;
    font-family: inherit;
  }
  /* The textarea's text is transparent; an identical copy with highlights is
     drawn behind it. Both must share exactly the same text metrics. */
  #editor {
    position: relative;
    margin-top: 16px;
  }
  #editor textarea, #backdrop {
    box-sizing: border-box;
    width: 100%;
    min-height: 12em;
    margin: 0;
    padding: 8px;
    border: 1px solid #999;
    font-family: inherit;
    font-size: 1.2rem;
    line-height: 1.5;
    letter-spacing: normal;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  #backdrop {
    position: absolute;
    inset: 0;
    border-color: transparent;
    color: #000;
    pointer-events: none;
  }
  #editor textarea {
    position: relative;
    display: block;
    background: transparent;
    color: transparent;
    caret-color: #000;
    resize: none;
    overflow: hidden;
  }
  #editor textarea::selection { background: rgba(0, 120, 255, 0.25); color: transparent; }
  .bad { color: #d00; }
  #summary { margin-top: 12px; font-size: 1.1rem; }
  #copy, #reset { margin-top: 12px; font-size: 1rem; cursor: pointer; }
  #copy:disabled { cursor: default; }
  .note { margin-left: 8px; font-size: 0.9rem; color: #666; }
  .pilish-bad { text-decoration: underline wavy #e80; text-decoration-skip-ink: none; }
  #lengths-header {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    margin: 24px 0 8px;
  }
  #lengths-header h2 { margin: 0; font-size: 1.1rem; }
  #lengths-header label { font-size: 0.95rem; }
  #lengths {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }
  #lengths:not(:empty) { border: 1px solid #999; padding: 6px 8px; }
  #lengths .row + .row { border-top: 1px solid #eee; }
  #lengths .count { margin-right: 0.6em; }
  #lengths .ok { color: #080; }
  #lengths .after { color: #aaa; }
  #lengths .expected { color: #888; }
  #lengths-header select, #custom { font: inherit; }
  #custom { width: 16em; padding: 2px 6px; }
  #custom-help { margin: 0 0 8px; }
  #check-note { margin-top: 8px; }
  #check-note:empty { display: none; }
  #check-note .ok { color: #080; }
  nav { max-width: 900px; margin: 0 auto 16px; font-size: 0.95rem; color: #666; }
  nav a { color: #06c; }
  nav b { color: #000; }
</style>
</head>
<body>
<nav><a href="index.html">Letterbox</a> &nbsp;|&nbsp; <a href="anagrams.html">Anagrams</a> · <b>Lipograms</b> · <a href="palindromes.html">Palindromes</a> · <a href="pangrams.html">Pangrams</a> · <a href="patterns.html">Patterns</a> · <a href="rhymes.html">Rhymes</a> · <a href="wordlists.html">Wordlists</a> &nbsp;|&nbsp; <a href="dates.html">Dates</a> · <a href="dice.html">Dice</a></nav>
<main>
  <label>Avoid:<input id="avoid" type="text" autocomplete="off"></label>
  <div id="editor">
    <div id="backdrop"></div>
    <textarea id="text" placeholder="Start writing…" spellcheck="false" autofocus></textarea>
  </div>
  <div id="summary"></div>
  <button id="copy">Copy to clipboard</button>
  <button id="reset">Start from scratch</button>
  <span id="copy-note" class="note">Banish all taboo symbols to unlock copying</span>
  <div id="lengths-header">
    <h2>Word lengths</h2>
    <label title="Check the word lengths against the digits of π, e or φ, or against your own numbers (…). Digits are read as in Standard Pilish: a word of n letters stands for n, 10 letters for 0, and longer words for two digits (12 letters for 1, 2).">Check against:
      <select id="sequence">
        <option value=""></option>
        <option value="pi">π</option>
        <option value="e">e</option>
        <option value="phi">φ</option>
        <option value="custom">…</option>
      </select>
    </label>
    <input id="custom" type="text" placeholder="e.g. 5 7 5 or 1.4142135" autocomplete="off" spellcheck="false" hidden>
  </div>
  <p id="custom-help" class="note" hidden>Numbers separated by spaces or commas are exact word lengths. A single number, like 1.4142135, is read digit by digit as in Pilish.</p>
  <div id="lengths"></div>
  <div id="check-note"></div>
</main>
<script>
  const TEXT_KEY = "lipogram-text";
  const AVOID_KEY = "lipogram-avoid";
  const text = document.getElementById("text");
  const avoid = document.getElementById("avoid");
  const backdrop = document.getElementById("backdrop");
  const summary = document.getElementById("summary");
  const copyButton = document.getElementById("copy");
  const copyNote = document.getElementById("copy-note");
  const SEQUENCE_KEY = "lipogram-sequence";
  const CUSTOM_KEY = "lipogram-custom";
  const sequenceSelect = document.getElementById("sequence");
  const customInput = document.getElementById("custom");
  const customHelp = document.getElementById("custom-help");
  const lengthsBox = document.getElementById("lengths");
  const checkNote = document.getElementById("check-note");

  // set a box's value via an editing command where possible, so Ctrl+Z can undo it
  function setBox(box, value) {
    box.focus();
    box.select();
    const ok = value === "" ? document.execCommand("delete") : document.execCommand("insertText", false, value);
    if (!ok || box.value !== value) box.value = value;
  }

  // reset needs two clicks in a row, to avoid accidents
  const resetButton = document.getElementById("reset");
  let resetArmed = false, resetTimer;
  function disarmReset() {
    resetArmed = false;
    clearTimeout(resetTimer);
    resetButton.textContent = "Start from scratch";
  }
  resetButton.addEventListener("blur", disarmReset);
  resetButton.addEventListener("click", () => {
    if (!resetArmed) {
      resetArmed = true;
      resetButton.textContent = "Click again to confirm";
      resetTimer = setTimeout(disarmReset, 3000);
      return;
    }
    disarmReset();
    setBox(avoid, "e");
    setBox(text, "");
    update();
  });

  copyButton.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(text.value);
    } catch (e) {
      // fallback for browsers that block the clipboard API on local files
      text.select();
      document.execCommand("copy");
    }
    copyButton.textContent = "In clipboard!";
    setTimeout(() => { copyButton.textContent = "Copy to clipboard"; }, 1500);
  });

  // Letters that don't decompose into a base letter and accents, and what they count as. The
  // single letters are the ones the Patterns page's (?d:...) also treats as unaccented; the
  // Anagrams and Pangrams pages have the same table.
  const UNDECOMPOSED = { ø: "o", ł: "l", đ: "d", ı: "i", ħ: "h", ŧ: "t", æ: "ae", œ: "oe", ß: "ss" };
  // the case-insensitive and accent-insensitive letters a character counts as (É → e), which
  // can be two for letters like œ (so œ breaks a lipogram in e)
  const fold = ch => [...ch.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "")].flatMap(c => [...(UNDECOMPOSED[c] ?? c)]);
  const escape = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function load(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value === null ? fallback : value;
    } catch (e) {
      return fallback;
    }
  }

  function save(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (e) {}
  }

  // Words are runs of letters and digits (accents and other marks aren't counted).
  // Apostrophes are dropped without ending the word (don't = 4); anything else
  // ends it (fun-filled = 3 6), as in Alphanumeric Pilish.
  const isWordChar = ch => /[\p{L}\p{N}]/u.test(ch);
  const isSilent = ch => /['’\p{M}]/u.test(ch);

  function findWords(value) {
    const words = [];
    let line = 0, word = null, index = 0;
    for (const ch of value) {
      if (isWordChar(ch)) {
        if (word === null) word = { start: index, length: 0, line };
        word.length++;
        word.end = index + ch.length;
      } else if (isSilent(ch) && word !== null) {
        // part of the word, but not counted
      } else if (!isSilent(ch)) {
        if (word !== null) words.push(word);
        word = null;
        if (ch === "\n") line++;
      }
      index += ch.length;
    }
    if (word !== null) words.push(word);
    return words;
  }

  // Digits of the constants (as strings, starting "31415…"), worked out with
  // integers scaled up by 10^(DIGITS + 10), the extra 10 digits absorbing rounding.
  const DIGITS = 10000;
  const SCALE = 10n ** BigInt(DIGITS + 10);
  const digitsOf = n => n.toString().slice(0, DIGITS);

  // π/4 = 4 arctan(1/5) − arctan(1/239) (Machin's formula)
  function computePi() {
    const arctanInverse = x => {
      const x2 = BigInt(x * x);
      let term = SCALE / BigInt(x), sum = term;
      for (let k = 3n, sign = -1n; term !== 0n; k += 2n, sign = -sign) {
        term /= x2;
        sum += sign * (term / k);
      }
      return sum;
    };
    return digitsOf(4n * (4n * arctanInverse(5) - arctanInverse(239)));
  }

  // e = 1/0! + 1/1! + 1/2! + …
  function computeE() {
    let term = SCALE, sum = 0n;
    for (let k = 1n; term !== 0n; k++) {
      sum += term;
      term /= k;
    }
    return digitsOf(sum);
  }

  // φ = (1 + √5) / 2, with the square root by Newton's method
  function computePhi() {
    const n = 5n * SCALE * SCALE;
    let x = 3n * SCALE, y = (x + n / x) / 2n;
    while (y < x) [x, y] = [y, (y + n / y) / 2n];
    return digitsOf((SCALE + x) / 2n);
  }

  const CONSTANTS = {
    pi: { name: "π", compute: computePi },
    e: { name: "e", compute: computeE },
    phi: { name: "φ", compute: computePhi },
  };

  // What the word lengths are checked against: { digits } for a number read digit by
  // digit as in Pilish, or { lengths } for a list of exact lengths. `finite` is false
  // for the constants, which go on beyond the digits worked out here.
  function sequenceFor(choice, customText) {
    const constant = CONSTANTS[choice];
    if (constant) {
      constant.digits ??= constant.compute();
      return { digits: constant.digits, name: constant.name, finite: false };
    }
    if (choice !== "custom") return null;
    const custom = customText.trim();
    // with no numbers, the lengths are just shown, without checking them
    if (custom === "") return { unchecked: true };
    // a single number, like 1.4142135, is read digit by digit
    if (/^(\d+\.?\d*|\.\d+)$/.test(custom)) return { digits: custom.replace(".", ""), name: "your number", finite: true };
    const parts = custom.split(/[\s,;]+/);
    const bad = parts.find(part => !/^\d+$/.test(part) || Number(part) === 0);
    if (bad !== undefined) return { error: `“${bad}” isn't a word length.` };
    return { lengths: parts.map(Number), finite: true };
  }

  // How many words match, and how far along the sequence they get (`used`: digits or
  // lengths). For digits, Standard Pilish: a word of n < 10 letters stands for n,
  // 10 letters for 0, and more than 10 letters for two digits (12 → 1, 2).
  function check(words, seq) {
    let used = 0;
    for (let i = 0; i < words.length; i++) {
      const n = words[i].length;
      if (seq.lengths) {
        if (used >= seq.lengths.length || n !== seq.lengths[used]) return { matched: i, used, wrong: true };
        used++;
        continue;
      }
      const wanted = n === 10 ? "0" : String(n);
      if (used + wanted.length > seq.digits.length) return { matched: i, used, wrong: seq.finite, beyond: !seq.finite };
      if (seq.digits.slice(used, used + wanted.length) !== wanted) return { matched: i, used, wrong: true };
      used += wanted.length;
    }
    return { matched: words.length, used };
  }

  // The next few word lengths, reading one word per digit (10 letters for 0) or per
  // length, followed by "…" if the sequence goes on after them. Empty at the end.
  const UPCOMING = 7;
  function upcoming(seq, used, count = UPCOMING) {
    const all = seq.lengths ? seq.lengths.map(String) : [...seq.digits];
    const lengths = all.slice(used, used + count).map(d => d === "0" && !seq.lengths ? "10" : d);
    if (used + count < all.length || (!seq.finite && lengths.length > 0)) lengths.push("…");
    return lengths;
  }

  const plural = (n, noun) => `${n.toLocaleString()} ${noun}${n === 1 ? "" : "s"}`;

  function showLengths(words, seq, result) {
    const rows = [];
    let row = null, rowLine = -1;
    // the lengths are only shown while checking them against something
    (seq ? words : []).forEach((word, i) => {
      if (row === null || word.line !== rowLine) {
        row = document.createElement("div");
        row.className = "row";
        rowLine = word.line;
        rows.push(row);
      }
      const span = document.createElement("span");
      span.className = "count";
      span.textContent = word.length;
      if (result) {
        if (i < result.matched) span.classList.add("ok");
        else if (i === result.matched && result.wrong) {
          span.classList.add("bad");
          const expected = document.createElement("span");
          expected.className = "expected";
          const lengths = upcoming(seq, result.used);
          expected.textContent = lengths.length === 0 ? " (expected no more words)" : ` (expected: ${lengths.join(" ")})`;
          span.append(expected);
        } else span.classList.add("after");
      }
      row.append(span);
    });
    // before there are any words, the box shows how to start
    if (result && row === null) {
      row = document.createElement("div");
      row.className = "row";
      const first = document.createElement("span");
      first.className = "expected";
      first.textContent = `Expected word lengths: ${upcoming(seq, 0).join(" ")}`;
      row.append(first);
      rows.push(row);
    }
    // while everything matches, the end of the counts shows what comes next
    else if (result && !result.wrong && !result.beyond) {
      const next = document.createElement("span");
      next.className = "expected";
      const lengths = upcoming(seq, result.used);
      next.textContent = lengths.length === 0 ? "(end)" : `(next: ${lengths.join(" ")})`;
      row.append(next);
    }
    lengthsBox.replaceChildren(...rows);

    if (!seq || seq.unchecked) {
      checkNote.textContent = "";
    } else if (seq.error) {
      checkNote.textContent = seq.error;
    } else if (result.beyond) {
      checkNote.textContent = `The text goes beyond the first ${DIGITS.toLocaleString()} digits of ${seq.name}, which is as far as this checks.`;
    } else {
      const total = seq.lengths ? seq.lengths.length : seq.digits.length;
      const unit = seq.lengths ? "length" : "digit";
      const matched = seq.lengths ? `${result.used.toLocaleString()} of ${plural(total, unit)}` : `${plural(result.used, unit)} of ${seq.name}`;
      if (result.wrong) {
        const word = words[result.matched];
        const where = text.value.includes("\n") ? ` (line ${word.line + 1})` : "";
        const quoted = `“${text.value.slice(word.start, word.end)}”${where}`;
        const [expected] = upcoming(seq, result.used, 1);
        checkNote.textContent = expected === undefined
          ? `${matched}, then ${quoted} goes past the end.`
          : `${matched}, then ${quoted} has ${plural(word.length, "letter")}, expected ${expected}.`;
      }
      else if (seq.finite && result.used === total) checkNote.innerHTML = `<span class="ok">✓ all ${plural(total, unit)} used</span>`;
      else if (result.used === 0) checkNote.textContent = "";
      else checkNote.innerHTML = `<span class="ok">✓ ${matched}</span>`;
    }
  }

  function update() {
    // avoided characters, ignoring whitespace; keep first-seen order for the breakdown
    const avoided = new Map();
    for (const ch of avoid.value) {
      if (/\s/.test(ch)) continue;
      for (const f of fold(ch)) if (!avoided.has(f)) avoided.set(f, 0);
    }

    const words = findWords(text.value);
    customInput.hidden = customHelp.hidden = sequenceSelect.value !== "custom";
    const seq = sequenceFor(sequenceSelect.value, customInput.value);
    const result = seq && !seq.error && !seq.unchecked ? check(words, seq) : null;
    // the first word of the wrong length, if any, is underlined
    const bad = result && result.wrong ? words[result.matched] : null;

    let html = "", total = 0, index = 0;
    for (const ch of text.value) {
      if (bad && index === bad.start) html += `<span class="pilish-bad">`;
      if (bad && index === bad.end) html += `</span>`;
      index += ch.length;
      const hits = fold(ch).filter(f => avoided.has(f));
      if (hits.length > 0) {
        for (const f of hits) avoided.set(f, avoided.get(f) + 1);
        total++;
        html += `<span class="bad">${escape(ch)}</span>`;
      } else {
        html += escape(ch);
      }
    }
    if (bad && index === bad.end) html += `</span>`;
    // a trailing newline needs something after it to take up a line
    backdrop.innerHTML = html + "​";

    text.style.height = "auto";
    text.style.height = text.scrollHeight + "px";

    let line = `Taboo count: ${total > 0 ? `<span class="bad">${total}</span>` : total}`;
    if (avoided.size > 1) {
      line += " (" + [...avoided].map(([ch, n]) => `${escape(ch)}: ${n}`).join(", ") + ")";
    }
    summary.innerHTML = line;
    copyButton.disabled = total > 0;
    copyNote.hidden = total === 0;

    showLengths(words, seq, result);

    save(TEXT_KEY, text.value);
    save(AVOID_KEY, avoid.value);
    save(SEQUENCE_KEY, sequenceSelect.value);
    save(CUSTOM_KEY, customInput.value);
  }

  text.value = load(TEXT_KEY, "");
  avoid.value = load(AVOID_KEY, "e");
  sequenceSelect.value = load(SEQUENCE_KEY, "");
  if (sequenceSelect.selectedIndex < 0) sequenceSelect.selectedIndex = 0;
  customInput.value = load(CUSTOM_KEY, "");
  sequenceSelect.addEventListener("change", () => {
    update();
    if (sequenceSelect.value === "custom") customInput.focus();
  });
  customInput.addEventListener("input", update);
  text.addEventListener("input", update);
  avoid.addEventListener("input", update);
  window.addEventListener("resize", update);
  update();
</script>
</body>
</html>
