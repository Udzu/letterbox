name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check generated pages are up to date
        run: |
          npm run build
          git add -N patterns.html wordlists.html rhymes.html
          git diff --exit-code -- patterns.html wordlists.html rhymes.html || { echo "A generated page is stale: run npm run build and commit it"; exit 1; }
